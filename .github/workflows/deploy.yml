name: Deploy to alwaysdata

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH to alwaysdata
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ssh-whatsappbot.alwaysdata.net
          username: ${{ secrets.ALWAYSDATA_SSH_USER }}
          password: ${{ secrets.ALWAYSDATA_SSH_PASSWORD }}
          port: 22
          timeout: 60s
          command_timeout: 10m
          script: |
            cd /home/whatsappbot/whatsapp-bot
            git pull origin main
            NODE_OPTIONS="--max-old-space-size=128" npm install --omit=dev --no-audit --no-fund --maxsockets=1
            
            # Safely kill old bot processes to trigger auto-restart
            MY_PID=$$
            for pid in $(pgrep -f "src/index.js"); do
              if [ "$pid" != "$MY_PID" ]; then
                kill -9 $pid 2>/dev/null || true
              fi
            done
            
            echo "SUCCESS: Code updated and process reloaded."
